apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconcile-settlements
  namespace: payments
spec:
  schedule: "0 9 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reconcile
              image: registry.internal/payouts-platform:0.14.2
              command: ["python", "-m", "jobs.reconcile"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: payouts-db, key: url}
                - name: NORTHWIND_API_KEY
                  valueFrom:
                    secretKeyRef: {name: northwind, key: api_key}
