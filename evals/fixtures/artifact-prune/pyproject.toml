[project]
name = "runstash"
version = "0.6.1"
description = "Archive experiment runs to S3 and prune local copies"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34"]

[project.scripts]
runstash = "runstash.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
